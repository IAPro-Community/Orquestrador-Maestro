name: Prepare authorized release tag

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: 'SHA completo do commit homologado (main ou release/1.2.0 para RC)'
        required: true
        type: string
      confirm:
        description: 'Autorizo criar a tag deste SHA; não publicar'
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: auto-tag-release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate authorized revision
    if: inputs.confirm == true && (github.ref == 'refs/heads/release/1.2.0' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.check.outputs.version }}
      unpublished: ${{ steps.check.outputs.unpublished }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Verify immutable authorized revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_SHA" ]]
          node scripts/check-release-ci.js "$EXPECTED_SHA"

      - name: Run pre-tag release gates
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          VERIFY_BASE_REF="$(git rev-parse HEAD)" npm run verify:pr
          npm run skills:contract-audit:strict
          pwsh -NoProfile -File scripts/validate-public.ps1
          pwsh -NoProfile -File scripts/validate-skills.ps1

      - name: Validate version and registry availability
        id: check
        shell: bash
        run: |
          set -euo pipefail
          version="$(node scripts/check-release-version.js)"
          [[ "$version" != 0.0.0 ]]
          node scripts/release-branch-policy.js "$version" "$GITHUB_REF_NAME"
          versions="$(npm view @iapro/orquestrador-maestro-cli versions --json --prefer-online)"
          unpublished="$(node -e 'const v=JSON.parse(process.argv[1]);if(!Array.isArray(v)||v.some(x=>typeof x!=="string"))throw Error("Invalid registry response");console.log(!v.includes(process.argv[2]));' "$versions" "$version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "unpublished=$unpublished" >> "$GITHUB_OUTPUT"

  tag:
    name: Create authorized immutable tag
    needs: validate
    if: needs.validate.outputs.unpublished == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout authorized commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0

      - name: Create and push tag
        shell: bash
        env:
          LOCAL_VERSION: ${{ needs.validate.outputs.version }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_SHA" ]]
          node scripts/check-release-ci.js "$EXPECTED_SHA"
          version="$LOCAL_VERSION"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          node scripts/release-branch-policy.js "$version" "$GITHUB_REF_NAME"
          tag="v${version}"

          if git rev-parse "$tag" >/dev/null 2>&1; then
            existing_sha="$(git rev-list -n 1 "$tag")"
            head_sha="$(git rev-parse HEAD)"
            if [ "$existing_sha" = "$head_sha" ]; then
              echo "Tag $tag already points to HEAD — no changes."
              exit 0
            fi
            echo "Tag $tag already points to $existing_sha, not HEAD $head_sha." >&2
            echo "Resolve the existing tag before retrying this release." >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Release $tag"
          git push origin "$tag"
          echo "Created and pushed $tag"

      # Publication is a separate manual authorization in release.yml.
