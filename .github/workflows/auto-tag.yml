name: Prepare authorized release tag

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: 'SHA completo do commit homologado (main ou v1)'
        required: true
        type: string
      confirm:
        description: 'Autorizo criar a tag deste SHA; não publicar'
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: auto-tag-release
  cancel-in-progress: false

jobs:
  auto-tag:
    name: Validate authorized release and create tag
    if: inputs.confirm == true && (github.ref_name == 'v1' || github.ref_name == 'main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify immutable authorized revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_SHA" ]]
          node scripts/check-release-ci.js "$EXPECTED_SHA"
      - name: Fetch remote tags
        shell: bash
        run: git fetch --tags origin

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Run pre-tag release gates
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          VERIFY_BASE_REF="$(git rev-parse HEAD)" npm run verify:pr
          npm run skills:contract-audit:strict
          pwsh -NoProfile -File scripts/validate-public.ps1
          pwsh -NoProfile -File scripts/validate-skills.ps1

      - name: Compare package version with npm registry
        id: check
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f package.json ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No package.json found — skipping."
            exit 0
          fi

          local_version="$(node -p "require('./package.json').version")"
          lock_version="$(node -p "require('./package-lock.json').version")"
          echo "local_version=$local_version" >> "$GITHUB_OUTPUT"

          if [ "$local_version" = "0.0.0" ] || [ -z "$local_version" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Local version is $local_version — skipping."
            exit 0
          fi

          if [ "$lock_version" != "$local_version" ]; then
            echo "package-lock.json version $lock_version does not match package.json version $local_version" >&2
            exit 1
          fi

          if ! LOCAL_VERSION="$local_version" node -e 'const v=process.env.LOCAL_VERSION;process.exit(require("fs").readFileSync("CHANGELOG.md","utf8").split(/\r?\n/).some(l=>l==="## "+v||l.startsWith("## "+v+" "))?0:1)'; then
            echo "CHANGELOG.md has no heading for version $local_version" >&2
            exit 1
          fi

          if ! npm_versions="$(npm view @iapro/orquestrador-maestro-cli versions --json 2>/dev/null)"; then
            echo "Unable to query npm registry; failing safely so this workflow can be retried." >&2
            exit 1
          fi

          if echo "$npm_versions" | LOCAL_VERSION="$local_version" node -e "
            const versions = JSON.parse(require('fs').readFileSync(0, 'utf8'));
            const local = process.env.LOCAL_VERSION;
            process.exit(versions.includes(local) ? 0 : 1);
          " 2>/dev/null; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Version $local_version already published — skipping."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Version $local_version not in registry — will create tag v$local_version"
          fi

      - name: Create and push tag
        if: steps.check.outputs.skip == 'false'
        shell: bash
        env:
          LOCAL_VERSION: ${{ steps.check.outputs.local_version }}
        run: |
          set -euo pipefail
          version="$LOCAL_VERSION"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          if [[ "$version" == 1.* ]]; then [[ "$GITHUB_REF_NAME" == v1 ]]; else [[ "$GITHUB_REF_NAME" == main ]]; fi
          tag="v${version}"

          if git rev-parse "$tag" >/dev/null 2>&1; then
            existing_sha="$(git rev-list -n 1 "$tag")"
            head_sha="$(git rev-parse HEAD)"
            if [ "$existing_sha" = "$head_sha" ]; then
              echo "Tag $tag already points to HEAD — resuming publication."
              exit 0
            fi
            echo "Tag $tag already points to $existing_sha, not HEAD $head_sha." >&2
            echo "Resolve the existing tag before retrying this release." >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Release $tag"
          git push origin "$tag"
          echo "Created and pushed $tag"

      # Publication is a separate manual authorization in release.yml.
