name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag de release a validar (ex.: v1.0.0)'
        required: true
        type: string
      expected_sha:
        description: 'SHA completo homologado que a tag deve apontar'
        required: true
        type: string
      confirm:
        description: 'Autorizo publicar este artefato no npm e GitHub'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: npm-release-publication
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    if: inputs.confirm == true && (github.ref_name == 'v1' || github.ref_name == 'main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      release_sha: ${{ steps.release.outputs.release_sha }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Validate tag and package version
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$REQUESTED_TAG"
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$EXPECTED_SHA" ]]
          node scripts/check-release-ci.js "$EXPECTED_SHA"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          version="${tag#v}"
          node scripts/check-release-version.js "$version"

      - name: Verify release is ancestor of its release line
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          release_branch="main"
          if [[ "$version" == 1.* ]]; then
            release_branch="v1"
          fi
          [[ "$GITHUB_REF_NAME" == "$release_branch" ]]
          git fetch origin "$release_branch"
          RELEASE_SHA="$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor "$RELEASE_SHA" "origin/$release_branch"; then
            echo "ERROR: Release commit $RELEASE_SHA is not contained in origin/$release_branch history."
            echo "This release must be based on the $release_branch release line. Rebase first."
            exit 1
          fi
          echo "release_branch=$release_branch" >> "$GITHUB_OUTPUT"
          echo "release_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
          echo "OK: Release commit is contained in origin/$release_branch history"

      - name: Install and run release gates
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run verify:pr
          npm run skills:contract-audit:strict
          pwsh -NoProfile -File ./scripts/validate-public.ps1
          pwsh -NoProfile -File ./scripts/validate-skills.ps1
          tarball="$(npm pack 2>/dev/null | tail -1)"
          sha256sum "$tarball" | awk '{print $1}' > package.sha256
          printf '%s\n' "$tarball" > package.name
        env:
          # Release ancestry was checked above in the correct direction:
          # the immutable tag must be contained in the release branch.
          # A PR gate cannot use the moving branch tip as this tag's base.
          VERIFY_BASE_REF: ${{ steps.release.outputs.release_sha }}

      - name: Upload validated package artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-package-${{ steps.release.outputs.release_sha }}
          path: |
            ./*.tgz
            package.sha256
            package.name
          if-no-files-found: error

  package-smoke:
    name: Package smoke test
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Download validated package artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-package-${{ needs.validate.outputs.release_sha }}

      - name: Verify artifact identity
        shell: bash
        run: |
          set -euo pipefail
          tarball="$(cat package.name)"
          test "$(sha256sum "$tarball" | awk '{print $1}')" = "$(cat package.sha256)"
          echo "TARBALL=$tarball" >> "$GITHUB_ENV"

      - name: Install tarball globally and smoke test
        shell: bash
        run: |
          set -euo pipefail
          npm install -g "./$TARBALL"
          orquestrador-maestro --version
          orquestrador-maestro memory --help
          temp_home="$(mktemp -d)"
          fake_bin="$temp_home/bin"
          mkdir -p "$fake_bin"
          printf '#!/usr/bin/env sh\nexit 0\n' > "$fake_bin/codex"
          chmod +x "$fake_bin/codex"
          HOME="$temp_home" PATH="$fake_bin:$PATH" orquestrador-maestro targets list --json
          HOME="$temp_home" PATH="$fake_bin:$PATH" orquestrador-maestro targets detect --home-path "$temp_home"
          HOME="$temp_home" PATH="$fake_bin:$PATH" orquestrador-maestro targets add codex --home-path "$temp_home"
          HOME="$temp_home" PATH="$fake_bin:$PATH" orquestrador-maestro targets list --home-path "$temp_home"
          HOME="$temp_home" PATH="$fake_bin:$PATH" orquestrador-maestro targets sync --home-path "$temp_home"
          HOME="$temp_home" PATH="$fake_bin:$PATH" orquestrador-maestro targets remove codex --home-path "$temp_home"
          rm -rf "$temp_home"
          temp_home="$(mktemp -d)"
          orquestrador-maestro install --home-path "$temp_home" --non-interactive
          orquestrador-maestro verify --home-path "$temp_home"
          ORQUESTRADOR_MAESTRO_SKIP_CLI_UPDATE=1 orquestrador-maestro update --home-path "$temp_home" --non-interactive
          orquestrador-maestro verify --home-path "$temp_home"
          rm -rf "$temp_home"
          npm uninstall -g @iapro/orquestrador-maestro-cli

  publish:
    name: Publish to npm
    needs: [validate, package-smoke]
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: read
      id-token: write
      actions: read
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Download validated package artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-package-${{ needs.validate.outputs.release_sha }}

      - name: Verify artifact identity
        shell: bash
        run: |
          set -euo pipefail
          tarball="$(cat package.name)"
          test "$(sha256sum "$tarball" | awk '{print $1}')" = "$(cat package.sha256)"
          echo "TARBALL=$tarball" >> "$GITHUB_ENV"

      - name: Set up npm with trusted dist-tag support
        run: npm install --global npm@12.2.0

      - name: Checkout immutable CI gate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.release_sha }}
          path: release-gate-source
          persist-credentials: false

      - name: Recheck CI evidence before publication
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ needs.validate.outputs.release_sha }}
        run: |
          set -euo pipefail
          [[ "$(git -C release-gate-source rev-parse HEAD)" == "$EXPECTED_SHA" ]]
          node release-gate-source/scripts/check-release-ci.js "$EXPECTED_SHA"

      - name: Publish package with safe dist-tag
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./release-gate-source/package.json').version")"
          bash release-gate-source/scripts/publish-validated-npm.sh "$TARBALL" "$(cat package.sha256)" "$version"

  github-release:
    name: Publish GitHub release
    needs: [validate, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout validated release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.release_sha }}
          persist-credentials: false

      - name: Download validated package artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-package-${{ needs.validate.outputs.release_sha }}
          path: release-artifact

      - name: Publish release notes and validated package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="v$version"
          tarball="$(cat release-artifact/package.name)"
          test "$(sha256sum "release-artifact/$tarball" | awk '{print $1}')" = "$(cat release-artifact/package.sha256)"
          node <<'NODE' > release-notes.md
          const fs = require('node:fs');
          const version = require('./package.json').version;
          const lines = fs.readFileSync('CHANGELOG.md', 'utf8').split(/\r?\n/);
          const start = lines.findIndex(line => line.startsWith(`## ${version} `) || line === `## ${version}`);
          if (start < 0) throw new Error(`Missing changelog for ${version}`);
          const end = lines.findIndex((line, i) => i > start && line.startsWith('## '));
          console.log(lines.slice(start + 1, end < 0 ? undefined : end).join('\n').trim());
          console.log('\nInstalação e atualização: [guia](https://github.com/IAPro-Community/Orquestrador-Maestro/blob/v1/docs/installation.md) · [migração V1](https://github.com/IAPro-Community/Orquestrador-Maestro/blob/v1/docs/migration-v1.md).');
          NODE
          release_flags=(--latest)
          if [[ "$version" == *-* ]]; then
            release_flags=(--prerelease --latest=false)
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "Orquestrador Maestro $tag" --notes-file release-notes.md "${release_flags[@]}"
            gh release upload "$tag" "release-artifact/$tarball" release-artifact/package.sha256 --clobber
          else
            gh release create "$tag" "release-artifact/$tarball" release-artifact/package.sha256 --verify-tag --title "Orquestrador Maestro $tag" --notes-file release-notes.md "${release_flags[@]}"
          fi
