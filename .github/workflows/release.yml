name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag de release a validar (ex.: v1.0.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-release-publication
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    outputs:
      release_sha: ${{ steps.release.outputs.release_sha }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Validate tag and package version
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="$REQUESTED_TAG"
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          version="${tag#v}"
          package_version="$(node -p "require('./package.json').version")"
          lock_version="$(node -p "require('./package-lock.json').version")"
          [[ "$package_version" == "$version" ]]
          [[ "$lock_version" == "$version" ]]
          EXPECTED_VERSION="$version" node <<'NODE'
          const fs = require('node:fs');
          const version = process.env.EXPECTED_VERSION;
          const read = p => JSON.parse(fs.readFileSync(p, 'utf8'));
          const values = [
            read('package-lock.json').packages[''].version,
            read('plugins/maestro-openai/plugin.json').version,
            read('plugins/maestro-openai/.codex-plugin/plugin.json').version,
            read('docs/product/CAPABILITY_MATRIX.json').product.packageVersion,
            /^PACKAGE_VERSION="([^"]+)"/m.exec(fs.readFileSync('scripts/bootstrap-install.sh', 'utf8'))?.[1],
            /^\$packageVersion = "([^"]+)"/m.exec(fs.readFileSync('scripts/bootstrap-install.ps1', 'utf8'))?.[1]
          ];
          if (values.some(value => value !== version)) throw new Error('Release manifest version mismatch');
          if (!fs.readFileSync('CHANGELOG.md', 'utf8').split(/\r?\n/).some(line => line === '## '+version || line.startsWith('## '+version+' '))) throw new Error('Missing changelog heading');
          NODE

      - name: Verify release is ancestor of its release line
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          release_branch="main"
          if [[ "$version" == 1.* ]]; then
            release_branch="v1"
          fi
          git fetch origin "$release_branch"
          RELEASE_SHA="$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor "$RELEASE_SHA" "origin/$release_branch"; then
            echo "ERROR: Release commit $RELEASE_SHA is not contained in origin/$release_branch history."
            echo "This release must be based on the $release_branch release line. Rebase first."
            exit 1
          fi
          echo "release_branch=$release_branch" >> "$GITHUB_OUTPUT"
          echo "release_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
          echo "OK: Release commit is contained in origin/$release_branch history"

      - name: Install and run release gates
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run verify:pr
          npm run skills:contract-audit:strict
          pwsh -NoProfile -File ./scripts/validate-public.ps1
          pwsh -NoProfile -File ./scripts/validate-skills.ps1
          tarball="$(npm pack 2>/dev/null | tail -1)"
          sha256sum "$tarball" | awk '{print $1}' > package.sha256
          printf '%s\n' "$tarball" > package.name
        env:
          # Release ancestry was checked above in the correct direction:
          # the immutable tag must be contained in the release branch.
          # A PR gate cannot use the moving branch tip as this tag's base.
          VERIFY_BASE_REF: ${{ steps.release.outputs.release_sha }}

      - name: Upload validated package artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-package-${{ steps.release.outputs.release_sha }}
          path: |
            ./*.tgz
            package.sha256
            package.name
          if-no-files-found: error

  package-smoke:
    name: Package smoke test
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Download validated package artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-package-${{ needs.validate.outputs.release_sha }}

      - name: Verify artifact identity
        shell: bash
        run: |
          set -euo pipefail
          tarball="$(cat package.name)"
          test "$(sha256sum "$tarball" | awk '{print $1}')" = "$(cat package.sha256)"
          echo "TARBALL=$tarball" >> "$GITHUB_ENV"

      - name: Install tarball globally and smoke test
        shell: bash
        run: |
          set -euo pipefail
          npm install -g "./$TARBALL"
          orquestrador-maestro --version
          orquestrador-maestro memory --help
          temp_home="$(mktemp -d)"
          fake_bin="$temp_home/bin"
          mkdir -p "$fake_bin"
          printf '#!/usr/bin/env sh\nexit 0\n' > "$fake_bin/codex"
          chmod +x "$fake_bin/codex"
          HOME="$temp_home" PATH="$fake_bin:$PATH" orquestrador-maestro targets list --json
          HOME="$temp_home" PATH="$fake_bin:$PATH" orquestrador-maestro targets detect --home-path "$temp_home"
          HOME="$temp_home" PATH="$fake_bin:$PATH" orquestrador-maestro targets add codex --home-path "$temp_home"
          HOME="$temp_home" PATH="$fake_bin:$PATH" orquestrador-maestro targets list --home-path "$temp_home"
          HOME="$temp_home" PATH="$fake_bin:$PATH" orquestrador-maestro targets sync --home-path "$temp_home"
          HOME="$temp_home" PATH="$fake_bin:$PATH" orquestrador-maestro targets remove codex --home-path "$temp_home"
          rm -rf "$temp_home"
          temp_home="$(mktemp -d)"
          orquestrador-maestro install --home-path "$temp_home" --non-interactive
          orquestrador-maestro verify --home-path "$temp_home"
          ORQUESTRADOR_MAESTRO_SKIP_CLI_UPDATE=1 orquestrador-maestro update --home-path "$temp_home" --non-interactive
          orquestrador-maestro verify --home-path "$temp_home"
          rm -rf "$temp_home"
          npm uninstall -g @iapro/orquestrador-maestro-cli

  publish:
    name: Publish to npm
    needs: [validate, package-smoke]
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Download validated package artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-package-${{ needs.validate.outputs.release_sha }}

      - name: Verify artifact identity
        shell: bash
        run: |
          set -euo pipefail
          tarball="$(cat package.name)"
          test "$(sha256sum "$tarball" | awk '{print $1}')" = "$(cat package.sha256)"
          echo "TARBALL=$tarball" >> "$GITHUB_ENV"

      - name: Set up npm with trusted dist-tag support
        run: npm install --global npm@12.2.0

      - name: Publish package with safe dist-tag
        shell: bash
        run: |
          set -euo pipefail
          version="$(tar -xOf "./$TARBALL" package/package.json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).version))")"
          dist_tag="latest"
          case "$version" in
            *-alpha.*) dist_tag="alpha" ;;
            *-beta.*) dist_tag="beta" ;;
            *-rc.*) dist_tag="next" ;;
            *-*) dist_tag="next" ;;
          esac
          echo "Publishing $version with npm dist-tag $dist_tag"
          package="@iapro/orquestrador-maestro-cli"
          update_dist_tag() {
            local tag_name="$1" current_version
            current_version="$(npm view "$package" "dist-tags.$tag_name" --prefer-online 2>/dev/null || true)"
            if [[ "$current_version" == "$version" ]]; then
              echo "npm dist-tag $tag_name already points to $version."
              return 0
            fi
            if npm dist-tag add "$package@$version" "$tag_name"; then
              return 0
            fi
            if [[ -n "${NODE_AUTH_TOKEN:-}" ]]; then
              echo "Retrying dist-tag update with the configured npm-release token."
              env -u ACTIONS_ID_TOKEN_REQUEST_URL -u ACTIONS_ID_TOKEN_REQUEST_TOKEN npm dist-tag add "$package@$version" "$tag_name"
            else
              return 1
            fi
          }
          artifact_integrity="$(node -e "const fs=require('node:fs'),crypto=require('node:crypto'); console.log('sha512-'+crypto.createHash('sha512').update(fs.readFileSync(process.argv[1])).digest('base64'))" "./$TARBALL")"
          registry_value() {
            node -e "let value=JSON.parse(process.argv[1]); if(Array.isArray(value)&&value.length===1)value=value[0]; if(typeof value!=='string')throw new Error('Invalid registry response'); process.stdout.write(value)" "$1"
          }
          # A failed registry request is not proof that a version is absent.
          err_file="$(mktemp)"
          if published_integrity="$(npm view "$package@$version" dist.integrity --json --prefer-online 2>"$err_file")"; then
            published_integrity="$(registry_value "$published_integrity")"
            [[ "$published_integrity" == "$artifact_integrity" ]] || { echo "Existing version differs from validated artifact"; exit 1; }
          elif grep -qE 'E404|No match found for version' "$err_file"; then
            publish_tag="$dist_tag"
            if [[ "$dist_tag" == latest ]]; then publish_tag=staged; fi
            npm publish "./$TARBALL" --ignore-scripts --access public --tag "$publish_tag"
          else
            echo "Registry lookup failed; refusing to publish."
            exit 1
          fi
          rm -f "$err_file"

          # Registry propagation can lag behind successful npm publish. Never
          # publish twice; confirm exact integrity and retrieve the same bytes.
          deadline=$((SECONDS + 1200))
          delay=5
          while true; do
            if raw="$(npm view "$package@$version" dist.integrity --json --prefer-online 2>/dev/null)" &&
               actual="$(registry_value "$raw" 2>/dev/null)"; then
              [[ "$actual" == "$artifact_integrity" ]] || { echo "Registry integrity mismatch"; exit 1; }
              break
            fi
            (( SECONDS < deadline )) || { echo "Timed out waiting for npm registry visibility"; exit 1; }
            sleep "$delay"
            delay=$((delay < 30 ? delay * 2 : 30))
          done
          registry_dir="$(mktemp -d)"
          trap 'rm -rf "$registry_dir"' EXIT
          while ! npm pack "$package@$version" --prefer-online --pack-destination "$registry_dir" >/dev/null 2>&1; do
            (( SECONDS < deadline )) || { echo "Timed out fetching registry tarball"; exit 1; }
            sleep 15
          done
          test "$(sha256sum "$registry_dir/$TARBALL" | awk '{print $1}')" = "$(cat package.sha256)"
          # Do not run package lifecycle scripts in a job holding publishing credentials.
          env -u NODE_AUTH_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_URL -u ACTIONS_ID_TOKEN_REQUEST_TOKEN npm install --ignore-scripts --global --prefix "$registry_dir/install" "$registry_dir/$TARBALL"
          test "$(env -u NODE_AUTH_TOKEN -u ACTIONS_ID_TOKEN_REQUEST_URL -u ACTIONS_ID_TOKEN_REQUEST_TOKEN "$registry_dir/install/bin/orquestrador-maestro" --version)" = "$version"

          # Do not promote an older stable release over a newer stable release.
          if [[ "$dist_tag" == latest ]]; then
            current_latest="$(npm view "$package" dist-tags.latest --prefer-online)"
            node -e 'const [current,next]=process.argv.slice(1); if(!/^\d+\.\d+\.\d+$/.test(current)||!/^\d+\.\d+\.\d+$/.test(next))process.exit(1);const a=current.split(".").map(Number),b=next.split(".").map(Number);for(let i=0;i<3;i++){if(a[i]>b[i])process.exit(1);if(a[i]<b[i])break;}' "$current_latest" "$version"
          fi
          update_dist_tag "$dist_tag"
          confirm_tag() {
            local tag_name="$1" deadline=$((SECONDS + 1200)) current
            while true; do
              current="$(npm view "$package" "dist-tags.$tag_name" --prefer-online 2>/dev/null || true)"
              [[ "$current" == "$version" ]] && return 0
              (( SECONDS < deadline )) || { echo "Timed out confirming dist-tag $tag_name"; return 1; }
              sleep 15
            done
          }
          confirm_tag "$dist_tag"
          # Graduate RC users only if next still targets this release line.
          if [[ "$dist_tag" == latest ]]; then
            next_version="$(npm view "$package" dist-tags.next --prefer-online)"
            if [[ "$next_version" == "$version"-rc.* ]]; then
              update_dist_tag next
              confirm_tag next
            fi
          fi
          if [[ "$version" == "1.0.0" ]]; then
            update_dist_tag beta
            confirm_tag beta
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-release:
    name: Publish GitHub release
    needs: [validate, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout validated release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.release_sha }}
          persist-credentials: false

      - name: Download validated package artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-package-${{ needs.validate.outputs.release_sha }}
          path: release-artifact

      - name: Publish release notes and validated package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="v$version"
          tarball="$(cat release-artifact/package.name)"
          test "$(sha256sum "release-artifact/$tarball" | awk '{print $1}')" = "$(cat release-artifact/package.sha256)"
          node <<'NODE' > release-notes.md
          const fs = require('node:fs');
          const version = require('./package.json').version;
          const lines = fs.readFileSync('CHANGELOG.md', 'utf8').split(/\r?\n/);
          const start = lines.findIndex(line => line.startsWith(`## ${version} `) || line === `## ${version}`);
          if (start < 0) throw new Error(`Missing changelog for ${version}`);
          const end = lines.findIndex((line, i) => i > start && line.startsWith('## '));
          console.log(lines.slice(start + 1, end < 0 ? undefined : end).join('\n').trim());
          console.log('\nInstalação e atualização: [guia](https://github.com/IAPro-Community/Orquestrador-Maestro/blob/v1/docs/installation.md) · [migração V1](https://github.com/IAPro-Community/Orquestrador-Maestro/blob/v1/docs/migration-v1.md).');
          NODE
          release_flags=(--latest)
          if [[ "$version" == *-* ]]; then
            release_flags=(--prerelease --latest=false)
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "Orquestrador Maestro $tag" --notes-file release-notes.md "${release_flags[@]}"
            gh release upload "$tag" "release-artifact/$tarball" release-artifact/package.sha256 --clobber
          else
            gh release create "$tag" "release-artifact/$tarball" release-artifact/package.sha256 --verify-tag --title "Orquestrador Maestro $tag" --notes-file release-notes.md "${release_flags[@]}"
          fi
