name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag de release a validar (ex.: v0.1.20)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    outputs:
      release_sha: ${{ steps.release.outputs.release_sha }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Validate tag and package version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
          fi
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="${tag#v}"
          package_version="$(node -p "require('./package.json').version")"
          lock_version="$(node -p "require('./package-lock.json').version")"
          [[ "$package_version" == "$version" ]]
          [[ "$lock_version" == "$version" ]]
          grep -qE "^## ${version}([ -]|$)" CHANGELOG.md

      - name: Verify release is ancestor of main
        id: release
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          RELEASE_SHA="$(git rev-parse HEAD)"
          if ! git merge-base --is-ancestor "$RELEASE_SHA" origin/main; then
            echo "ERROR: Release commit $RELEASE_SHA is not contained in origin/main history."
            echo "This release must be based on main. Rebase first."
            exit 1
          fi
          echo "release_sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
          echo "OK: Release commit is contained in origin/main history"

      - name: Install and run release gates
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run verify:pr
          pwsh -NoProfile -File ./scripts/validate-public.ps1
          pwsh -NoProfile -File ./scripts/validate-skills.ps1
          tarball="$(npm pack 2>/dev/null | tail -1)"
          sha256sum "$tarball" | awk '{print $1}' > package.sha256
          printf '%s\n' "$tarball" > package.name

      - name: Upload validated package artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-package-${{ steps.release.outputs.release_sha }}
          path: |
            ./*.tgz
            package.sha256
            package.name
          if-no-files-found: error

  package-smoke:
    name: Package smoke test
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Download validated package artifact
        uses: actions/download-artifact@v4
        with:
          name: release-package-${{ needs.validate.outputs.release_sha }}

      - name: Verify artifact identity
        shell: bash
        run: |
          set -euo pipefail
          tarball="$(cat package.name)"
          test "$(sha256sum "$tarball" | awk '{print $1}')" = "$(cat package.sha256)"
          echo "TARBALL=$tarball" >> "$GITHUB_ENV"

      - name: Install tarball globally and smoke test
        shell: bash
        run: |
          set -euo pipefail
          npm install -g "./$TARBALL"
          orquestrador-maestro --version
          orquestrador-maestro memory --help
          temp_home="$(mktemp -d)"
          fake_bin="$temp_home/bin"
          mkdir -p "$fake_bin"
          printf '#!/usr/bin/env sh\nexit 0\n' > "$fake_bin/codex"
          chmod +x "$fake_bin/codex"
          HOME="$temp_home" PATH="$fake_bin:$PATH" orquestrador-maestro targets list --json
          HOME="$temp_home" PATH="$fake_bin:$PATH" orquestrador-maestro targets detect --home-path "$temp_home"
          HOME="$temp_home" PATH="$fake_bin:$PATH" orquestrador-maestro targets add codex --home-path "$temp_home"
          HOME="$temp_home" PATH="$fake_bin:$PATH" orquestrador-maestro targets list --home-path "$temp_home"
          HOME="$temp_home" PATH="$fake_bin:$PATH" orquestrador-maestro targets sync --home-path "$temp_home"
          HOME="$temp_home" PATH="$fake_bin:$PATH" orquestrador-maestro targets remove codex --home-path "$temp_home"
          rm -rf "$temp_home"
          npm uninstall -g @iapro/orquestrador-maestro-cli

  publish:
    name: Publish to npm
    needs: [validate, package-smoke]
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Download validated package artifact
        uses: actions/download-artifact@v4
        with:
          name: release-package-${{ needs.validate.outputs.release_sha }}

      - name: Verify artifact identity
        shell: bash
        run: |
          set -euo pipefail
          tarball="$(cat package.name)"
          test "$(sha256sum "$tarball" | awk '{print $1}')" = "$(cat package.sha256)"
          echo "TARBALL=$tarball" >> "$GITHUB_ENV"

      - name: Publish stable package
        run: npm publish "./$TARBALL" --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
