name: GitHub Pages - Maestro Site

on:
  push:
    branches: [v1]
    paths:
      - 'site/**'
      - 'docs/**'
      - 'README.md'
      - 'README-technical-reference.md'
      - 'assets/orquestrador-maestro-logo.png'
      - 'orquestrador/**'
      - 'skill-library/**'
      - 'runtime/planner/intent-router.js'
      - 'benchmark-harness/scenarios/**'
      - '.github/workflows/pages.yml'
  pull_request:
    branches: [v1]
    paths:
      - 'site/**'
      - 'docs/**'
      - 'README.md'
      - 'README-technical-reference.md'
      - 'assets/orquestrador-maestro-logo.png'
      - 'orquestrador/**'
      - 'skill-library/**'
      - 'runtime/planner/intent-router.js'
      - 'benchmark-harness/scenarios/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20.19.0'

      - name: Install site dependencies
        run: npm ci --prefix site --no-audit --no-fund

      - name: Check router parity
        run: npm --prefix site run check:router-parity

      - name: Build React site
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: npm --prefix site run build

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site/build

  deploy:
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: maestro-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
