name: GitHub Pages - Maestro Site

on:
  push:
    branches: [v1]
    paths:
      - 'site/**'
      - 'docs/**'
      - 'README.md'
      - 'README-technical-reference.md'
      - 'assets/orquestrador-maestro-logo.png'
      - 'orquestrador/**'
      - 'skill-library/**'
      - 'runtime/planner/intent-router.js'
      - 'benchmark-harness/scenarios/**'
      - '.github/workflows/pages.yml'
  pull_request:
    branches: [v1]
    paths:
      - 'site/**'
      - 'docs/**'
      - 'README.md'
      - 'README-technical-reference.md'
      - 'assets/orquestrador-maestro-logo.png'
      - 'orquestrador/**'
      - 'skill-library/**'
      - 'runtime/planner/intent-router.js'
      - 'benchmark-harness/scenarios/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20.19.0'

      - name: Install site dependencies
        run: npm ci --prefix site --no-audit --no-fund

      - name: Check router parity
        run: npm --prefix site run check:router-parity

      - name: Build React site
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: npm --prefix site run build

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/build

  deploy:
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: maestro-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
