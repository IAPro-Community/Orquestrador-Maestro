name: Weekly CI Benchmark

on:
  schedule:
    - cron: "0 6 * * 1" # Monday 06:00 UTC
  workflow_dispatch:

jobs:
  benchmark:
    name: CI Benchmark (Weekly)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        working-directory: benchmark-harness
        run: npm ci

      - name: Preflight check
        working-directory: benchmark-harness
        run: npx tsx src/cli/index.ts preflight

      - name: Run CI benchmark
        working-directory: benchmark-harness
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          npx tsx src/cli/index.ts suite \
            --profile ci \
            --runs 3

      - name: Generate report
        working-directory: benchmark-harness
        run: |
          RUN_SET=$(date +%Y%m%d-%H%M%S)
          mkdir -p results
          npx tsx src/cli/index.ts report "$RUN_SET" --format markdown > results/summary-${RUN_SET}.md
          npx tsx src/cli/index.ts report "$RUN_SET" --format json > results/summary-${RUN_SET}.json

      - name: Download previous benchmark artifact
        uses: actions/download-artifact@v4
        with:
          name: ci-benchmark-results
          path: benchmark-harness/previous-results/
        continue-on-error: true

      - name: Compare with previous run
        working-directory: benchmark-harness
        run: |
          CURRENT=$(ls -t results/summary-*.json 2>/dev/null | head -1)
          PREVIOUS=$(ls -t previous-results/summary-*.json 2>/dev/null | head -1)

          if [ -n "$CURRENT" ] && [ -n "$PREVIOUS" ]; then
            npx tsx src/cli/index.ts compare "$CURRENT" "$PREVIOUS"
          else
            echo "## Benchmark Comparison" >> $GITHUB_STEP_SUMMARY
            echo "Baseline unavailable — skipping comparison." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload current results
        uses: actions/upload-artifact@v4
        with:
          name: ci-benchmark-results
          path: benchmark-harness/results/
          retention-days: 14

      - name: Post results to Step Summary
        if: always()
        working-directory: benchmark-harness
        run: |
          RESULTS_DIR="results"
          LATEST_MD=$(ls -t "$RESULTS_DIR"/summary-*.md 2>/dev/null | head -1)
          if [ -n "$LATEST_MD" ]; then
            echo "## Weekly CI Benchmark Results" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            cat "$LATEST_MD" >> $GITHUB_STEP_SUMMARY
          else
            echo "## Weekly CI Benchmark Completed" >> $GITHUB_STEP_SUMMARY
            echo "Results uploaded as artifacts." >> $GITHUB_STEP_SUMMARY
          fi
