name: Tests

on:
  push:
    branches: [main, feat/context-memory-benchmark]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-full:
    name: Full tests — Node ${{ matrix.node-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node-version: [20, 22]
        os: [ubuntu-latest]
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup Bun for OpenTUI lifecycle tests
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: npm pack dry-run
        run: npm pack --dry-run

      - name: Create tarball
        run: npm pack

      - name: Install from tarball
        run: npm install -g *.tgz

      - name: CLI smoke tests
        run: |
          orquestrador-maestro version
          orquestrador-maestro memory --help
          orquestrador-maestro memory status
          orquestrador-maestro benchmark --help
          orquestrador-maestro context brief --help
          temp_home="$(mktemp -d)"
          fake_bin="$temp_home/bin"
          mkdir -p "$fake_bin"
          printf '#!/usr/bin/env sh\nexit 0\n' > "$fake_bin/codex"
          chmod +x "$fake_bin/codex"
          HOME="$temp_home" PATH="$fake_bin:$PATH" orquestrador-maestro targets detect --home-path "$temp_home"
          HOME="$temp_home" PATH="$fake_bin:$PATH" orquestrador-maestro targets add codex --home-path "$temp_home"
          HOME="$temp_home" PATH="$fake_bin:$PATH" orquestrador-maestro targets list --home-path "$temp_home"
          HOME="$temp_home" PATH="$fake_bin:$PATH" orquestrador-maestro targets sync --home-path "$temp_home"
          HOME="$temp_home" PATH="$fake_bin:$PATH" orquestrador-maestro targets remove codex --home-path "$temp_home"
          rm -rf "$temp_home"

      - name: Cleanup
        if: always()
        run: npm uninstall -g @iapro/orquestrador-maestro-cli

  test-windows:
    name: Smoke tests — Node ${{ matrix.node-version }} on Windows
    runs-on: windows-latest
    strategy:
      matrix:
        node-version: [20, 22]
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Run smoke tests
        run: npm run test:smoke

      - name: Create tarball
        run: npm pack

      - name: Install from tarball
        run: npm install -g $(Get-ChildItem *.tgz | Select-Object -First 1)

      - name: CLI smoke tests
        run: |
          orquestrador-maestro version
          orquestrador-maestro memory --help
          orquestrador-maestro memory status
          orquestrador-maestro benchmark --help
          orquestrador-maestro context brief --help

      - name: Smart target lifecycle
        shell: pwsh
        run: |
          $tempHome = Join-Path $env:RUNNER_TEMP "maestro-targets-$env:GITHUB_RUN_ID"
          $fakeBin = Join-Path $tempHome "bin"
          New-Item -ItemType Directory -Force -Path $fakeBin | Out-Null
          Set-Content -LiteralPath (Join-Path $fakeBin "codex.cmd") -Value "@echo off`r`nexit /b 0`r`n"
          $env:PATH = "$fakeBin;$env:PATH"
          orquestrador-maestro targets detect --home-path $tempHome
          orquestrador-maestro targets add codex --home-path $tempHome
          orquestrador-maestro targets list --home-path $tempHome
          orquestrador-maestro targets sync --home-path $tempHome
          orquestrador-maestro targets remove codex --home-path $tempHome
          $pkgRoot = (npm root -g).Trim()
          $sync = Join-Path $pkgRoot "@iapro\orquestrador-maestro-cli\orquestrador\sync-skills.ps1"
          & powershell -NoProfile -File $sync -Apply -HomePath $tempHome -Only codex
          if ($LASTEXITCODE -ne 0) { throw "PowerShell sync failed" }
          Remove-Item -LiteralPath $tempHome -Recurse -Force

      - name: Cleanup
        if: always()
        run: npm uninstall -g @iapro/orquestrador-maestro-cli

  test-macos:
    name: Smoke tests — Node ${{ matrix.node-version }} on macOS
    runs-on: macos-latest
    strategy:
      matrix:
        node-version: [20, 22]
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Run smoke tests
        run: npm run test:smoke

      - name: Create tarball
        run: npm pack

      - name: Install from tarball
        run: npm install -g *.tgz

      - name: CLI smoke tests
        run: |
          orquestrador-maestro version
          orquestrador-maestro memory --help
          orquestrador-maestro memory status
          orquestrador-maestro benchmark --help
          orquestrador-maestro context brief --help

      - name: Smart target lifecycle
        shell: bash
        run: |
          set -euo pipefail
          temp_home="$(mktemp -d)"
          fake_bin="$temp_home/bin"
          mkdir -p "$fake_bin"
          printf '#!/usr/bin/env sh\nexit 0\n' > "$fake_bin/codex"
          chmod +x "$fake_bin/codex"
          HOME="$temp_home" PATH="$fake_bin:$PATH" orquestrador-maestro targets detect --home-path "$temp_home"
          HOME="$temp_home" PATH="$fake_bin:$PATH" orquestrador-maestro targets add codex --home-path "$temp_home"
          HOME="$temp_home" PATH="$fake_bin:$PATH" orquestrador-maestro targets list --home-path "$temp_home"
          HOME="$temp_home" PATH="$fake_bin:$PATH" orquestrador-maestro targets sync --home-path "$temp_home"
          HOME="$temp_home" PATH="$fake_bin:$PATH" orquestrador-maestro targets remove codex --home-path "$temp_home"
          rm -rf "$temp_home"

      - name: Cleanup
        if: always()
        run: npm uninstall -g @iapro/orquestrador-maestro-cli
