name: Tests

on:
  push:
    branches: [main, feat/context-memory-benchmark]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-full:
    name: Full tests — Node ${{ matrix.node-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node-version: [20, 22]
        os: [ubuntu-latest]
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup Bun for OpenTUI lifecycle tests
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: npm pack dry-run
        run: npm pack --dry-run

      - name: Create tarball
        run: npm pack

      - name: Install from tarball
        run: npm install -g *.tgz

      - name: CLI smoke tests
        run: |
          orquestrador-maestro version
          orquestrador-maestro memory --help
          orquestrador-maestro memory status
          orquestrador-maestro benchmark --help
          orquestrador-maestro context brief --help

      - name: Cleanup
        if: always()
        run: npm uninstall -g @iapro/orquestrador-maestro-cli 2>/dev/null || true

  test-windows:
    name: Smoke tests — Node ${{ matrix.node-version }} on Windows
    runs-on: windows-latest
    strategy:
      matrix:
        node-version: [20, 22]
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Run smoke tests
        run: npm run test:smoke

      - name: Create tarball
        run: npm pack

      - name: Install from tarball
        run: npm install -g $(Get-ChildItem *.tgz | Select-Object -First 1)

      - name: CLI smoke tests
        run: |
          orquestrador-maestro version
          orquestrador-maestro memory --help
          orquestrador-maestro memory status
          orquestrador-maestro benchmark --help
          orquestrador-maestro context brief --help

      - name: Cleanup
        if: always()
        run: npm uninstall -g @iapro/orquestrador-maestro-cli 2>$null

  test-macos:
    name: Smoke tests — Node ${{ matrix.node-version }} on macOS
    runs-on: macos-latest
    strategy:
      matrix:
        node-version: [20, 22]
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Run smoke tests
        run: npm run test:smoke

      - name: Create tarball
        run: npm pack

      - name: Install from tarball
        run: npm install -g *.tgz

      - name: CLI smoke tests
        run: |
          orquestrador-maestro version
          orquestrador-maestro memory --help
          orquestrador-maestro memory status
          orquestrador-maestro benchmark --help
          orquestrador-maestro context brief --help

      - name: Cleanup
        if: always()
        run: npm uninstall -g @iapro/orquestrador-maestro-cli 2>/dev/null || true
