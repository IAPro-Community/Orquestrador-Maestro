name: Security checks

on:
  push:
    branches: [v1]
  pull_request:
    branches: [v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL — JavaScript and TypeScript
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3

  dependency-audit:
    name: npm dependency audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Audit CLI and bundled examples
        run: npm run audit

      - name: Audit documentation site
        run: |
          npm ci --prefix site --no-audit --no-fund
          npm audit --prefix site

      - name: Audit benchmark harness
        run: |
          npm ci --prefix benchmark-harness --no-audit --no-fund
          npm audit --prefix benchmark-harness

# GitHub Secret Scanning and push protection are enabled in repository settings.
