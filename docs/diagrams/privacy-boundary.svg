<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
  <title id="title">Fronteira de privacidade do snapshot público</title>
  <desc id="desc">O repositório contém estrutura sanitizada; dados, sessões, credenciais e contexto privado ficam na máquina do usuário.</desc>
  <rect width="960" height="300" rx="24" fill="#0f172a"/>
  <g font-family="system-ui, sans-serif">
    <text x="480" y="42" text-anchor="middle" fill="#f8fafc" font-size="20" font-weight="700">O que é público e o que continua local</text>
    <rect x="55" y="75" width="390" height="175" rx="18" fill="#12333b" stroke="#5eead4" stroke-width="2"/>
    <text x="250" y="112" text-anchor="middle" fill="#ccfbf1" font-size="16" font-weight="700">Publicado no repositório</text>
    <text x="92" y="150" fill="#e2e8f0" font-size="14">• Regras, skills e scripts sanitizados</text>
    <text x="92" y="181" fill="#e2e8f0" font-size="14">• Estrutura instalável e revisável</text>
    <text x="92" y="212" fill="#e2e8f0" font-size="14">• Placeholders no lugar de dados pessoais</text>
    <path d="M465 162h30m0 0-11-10m11 10-11 10" stroke="#b58c3a" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="515" y="75" width="390" height="175" rx="18" fill="#35212a" stroke="#fda4af" stroke-width="2"/>
    <text x="710" y="112" text-anchor="middle" fill="#fecdd3" font-size="16" font-weight="700">Permanece na sua máquina</text>
    <text x="552" y="150" fill="#e2e8f0" font-size="14">• Credenciais, sessões e caminhos locais</text>
    <text x="552" y="181" fill="#e2e8f0" font-size="14">• Logs, caches, backups e memória privada</text>
    <text x="552" y="212" fill="#e2e8f0" font-size="14">• Conteúdo de projetos e reference packs</text>
  </g>
</svg>
