<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Budget de contexto: Maestro 0.5.0 versus V1</title>
  <desc id="desc">Comparação do teto de tokens de contexto por classe de complexidade. A versão 0.5.0 usa 8000 tokens no fluxo legado; a V1 usa 1500, 3000, 6000, 10000 e 16000 tokens para MICRO, SIMPLE, STANDARD, COMPLEX e DEEP.</desc>
  <rect width="1200" height="680" rx="24" fill="#ffffff"/>
  <text x="60" y="66" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#111827">Contexto deixa de ser “tamanho único”</text>
  <text x="60" y="102" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" fill="#4b5563">0.5.0 usa ~8k no fluxo legado; V1 adapta o teto à complexidade antes do roteamento.</text>

  <rect x="60" y="128" width="16" height="16" rx="4" fill="#9ca3af"/>
  <text x="84" y="141" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#374151">0.5.0 atual</text>
  <rect x="205" y="128" width="16" height="16" rx="4" fill="#111827"/>
  <text x="229" y="141" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#374151">V1 proposta</text>

  <line x1="100" y1="560" x2="1140" y2="560" stroke="#d1d5db" stroke-width="1.5"/>
  <line x1="100" y1="460" x2="1140" y2="460" stroke="#eef0f3" stroke-width="1"/>
  <line x1="100" y1="360" x2="1140" y2="360" stroke="#eef0f3" stroke-width="1"/>
  <line x1="100" y1="260" x2="1140" y2="260" stroke="#eef0f3" stroke-width="1"/>
  <line x1="100" y1="160" x2="1140" y2="160" stroke="#eef0f3" stroke-width="1"/>
  <text x="55" y="566" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#6b7280">0</text>
  <text x="42" y="466" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#6b7280">4k</text>
  <text x="42" y="366" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#6b7280">8k</text>
  <text x="34" y="266" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#6b7280">12k</text>
  <text x="34" y="166" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#6b7280">16k</text>

  <!-- MICRO -->
  <rect x="150" y="360" width="52" height="200" rx="8" fill="#9ca3af"/>
  <rect x="210" y="522.5" width="52" height="37.5" rx="8" fill="#111827"/>
  <text x="176" y="347" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#4b5563">8k</text>
  <text x="236" y="510" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#111827">1.5k</text>
  <text x="206" y="595" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#111827">MICRO</text>
  <text x="206" y="619" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#047857">−81%</text>

  <!-- SIMPLE -->
  <rect x="350" y="360" width="52" height="200" rx="8" fill="#9ca3af"/>
  <rect x="410" y="485" width="52" height="75" rx="8" fill="#111827"/>
  <text x="376" y="347" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#4b5563">8k</text>
  <text x="436" y="472" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#111827">3k</text>
  <text x="406" y="595" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#111827">SIMPLE</text>
  <text x="406" y="619" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#047857">−63%</text>

  <!-- STANDARD -->
  <rect x="550" y="360" width="52" height="200" rx="8" fill="#9ca3af"/>
  <rect x="610" y="410" width="52" height="150" rx="8" fill="#111827"/>
  <text x="576" y="347" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#4b5563">8k</text>
  <text x="636" y="397" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#111827">6k</text>
  <text x="606" y="595" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#111827">STANDARD</text>
  <text x="606" y="619" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#047857">−25%</text>

  <!-- COMPLEX -->
  <rect x="750" y="360" width="52" height="200" rx="8" fill="#9ca3af"/>
  <rect x="810" y="310" width="52" height="250" rx="8" fill="#111827"/>
  <text x="776" y="347" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#4b5563">8k</text>
  <text x="836" y="297" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#111827">10k</text>
  <text x="806" y="595" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#111827">COMPLEX</text>
  <text x="806" y="619" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#7c3aed">+25%</text>

  <!-- DEEP -->
  <rect x="950" y="360" width="52" height="200" rx="8" fill="#9ca3af"/>
  <rect x="1010" y="160" width="52" height="400" rx="8" fill="#111827"/>
  <text x="976" y="347" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#4b5563">8k</text>
  <text x="1036" y="147" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#111827">16k</text>
  <text x="1006" y="595" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" fill="#111827">DEEP</text>
  <text x="1006" y="619" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" fill="#7c3aed">+100%</text>

  <text x="60" y="654" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" fill="#6b7280">Fonte: bin/orquestrador-maestro.js (0.5 baseline) e runtime/planner/complexity-gate.js (V1).</text>
</svg>