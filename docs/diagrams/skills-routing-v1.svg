<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560" role="img" aria-labelledby="title desc">
  <title id="title">Como o Maestro escolhe Skills na V1</title>
  <desc id="desc">O pedido passa pelo Complexity Gate, coleta sinais do projeto, considera contrato e evidências de routing, rejeita rotas inadequadas e seleciona apenas as Skills que cabem no budget.</desc>
  <rect width="1240" height="560" rx="24" fill="#ffffff"/>
  <text x="60" y="62" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#111827">Você descreve o trabalho; o Maestro escolhe a capacidade</text>
  <text x="60" y="98" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" fill="#4b5563">Na V1, Skills deixam de ser uma lista para decorar e passam a ser capacidades roteadas por evidência, contexto e complexidade.</text>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect x="60" y="160" width="180" height="96" rx="16" fill="#f9fafb" stroke="#d1d5db"/>
    <text x="150" y="197" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">Seu pedido</text>
    <text x="150" y="223" text-anchor="middle" font-size="13" fill="#4b5563">“corrija o bug e</text>
    <text x="150" y="242" text-anchor="middle" font-size="13" fill="#4b5563">prove a causa raiz”</text>

    <path d="M240 208 H300" stroke="#9ca3af" stroke-width="2.5" marker-end="url(#arrow)"/>

    <rect x="300" y="160" width="180" height="96" rx="16" fill="#f9fafb" stroke="#d1d5db"/>
    <text x="390" y="195" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">Complexity Gate</text>
    <text x="390" y="222" text-anchor="middle" font-size="13" fill="#4b5563">MICRO → DEEP</text>
    <text x="390" y="242" text-anchor="middle" font-size="13" fill="#4b5563">define budget</text>

    <path d="M480 208 H540" stroke="#9ca3af" stroke-width="2.5" marker-end="url(#arrow)"/>

    <rect x="540" y="140" width="220" height="136" rx="16" fill="#f9fafb" stroke="#d1d5db"/>
    <text x="650" y="176" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">Evidência do projeto</text>
    <text x="650" y="203" text-anchor="middle" font-size="13" fill="#4b5563">intent + aliases</text>
    <text x="650" y="223" text-anchor="middle" font-size="13" fill="#4b5563">stack + arquivos alterados</text>
    <text x="650" y="243" text-anchor="middle" font-size="13" fill="#4b5563">capabilities + memória</text>
    <text x="650" y="263" text-anchor="middle" font-size="13" fill="#4b5563">negative routing</text>

    <path d="M760 208 H820" stroke="#9ca3af" stroke-width="2.5" marker-end="url(#arrow)"/>

    <rect x="820" y="140" width="180" height="136" rx="16" fill="#111827"/>
    <text x="910" y="177" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">Router v3</text>
    <text x="910" y="205" text-anchor="middle" font-size="13" fill="#e5e7eb">seleciona</text>
    <text x="910" y="225" text-anchor="middle" font-size="13" fill="#e5e7eb">rejeita</text>
    <text x="910" y="245" text-anchor="middle" font-size="13" fill="#e5e7eb">explica</text>
    <text x="910" y="265" text-anchor="middle" font-size="13" fill="#e5e7eb">limita fan-out</text>

    <path d="M1000 208 H1060" stroke="#9ca3af" stroke-width="2.5" marker-end="url(#arrow)"/>

    <rect x="1060" y="160" width="140" height="96" rx="16" fill="#f9fafb" stroke="#d1d5db"/>
    <text x="1130" y="197" text-anchor="middle" font-size="16" font-weight="700" fill="#111827">Skill certa</text>
    <text x="1130" y="222" text-anchor="middle" font-size="13" fill="#4b5563">+ contexto</text>
    <text x="1130" y="242" text-anchor="middle" font-size="13" fill="#4b5563">+ verificação</text>

    <rect x="90" y="350" width="1020" height="124" rx="18" fill="#f9fafb" stroke="#e5e7eb"/>
    <text x="120" y="386" font-size="16" font-weight="700" fill="#111827">Skill Contract V2 dá a cada Skill um contrato verificável</text>
    <text x="120" y="418" font-size="14" fill="#374151">quando usar · quando não usar · capabilities · contexto requerido/útil/evitar · outputs · verificação · risco · maturidade · custo</text>
    <text x="120" y="450" font-size="14" fill="#4b5563">Resultado: o usuário não precisa conhecer 56 nomes para começar. Pode pedir o trabalho em linguagem natural e inspecionar a decisão com route explain.</text>
  </g>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#9ca3af"/>
    </marker>
  </defs>
</svg>