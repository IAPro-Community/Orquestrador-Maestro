<svg xmlns="http://www.w3.org/2000/svg" width="920" height="280" viewBox="0 0 920 280" role="img" aria-labelledby="title desc">
  <title id="title">Comparação qualitativa de custo de tokens</title>
  <desc id="desc">O fluxo compatível mantém o prompt no tamanho nativo. Contexto adicional e strict são opt-in.</desc>
  <style>
    text { font-family: Arial, sans-serif; fill: #193c3c; }
    .axis { stroke: #193c3c; stroke-width: 2; }
    .native { fill: #8bc9b0; }
    .optional { fill: #f3c969; }
    .label { font-size: 16px; font-weight: 700; }
    .small { font-size: 13px; }
  </style>
  <line class="axis" x1="220" y1="38" x2="220" y2="238"/>
  <line class="axis" x1="220" y1="238" x2="870" y2="238"/>
  <text class="small" x="220" y="260">0 tokens adicionais</text>
  <text class="small" x="760" y="260">mais contexto</text>
  <text class="label" x="24" y="86">CLI nativo</text>
  <rect class="native" x="220" y="64" width="18" height="28" rx="4"/>
  <text class="small" x="252" y="84">padrão preservado</text>
  <text class="label" x="24" y="146">compatibility</text>
  <rect class="native" x="220" y="124" width="18" height="28" rx="4"/>
  <text class="small" x="252" y="144">avisos locais, sem chamada extra</text>
  <text class="label" x="24" y="206">strict / contexto</text>
  <rect class="optional" x="220" y="184" width="210" height="28" rx="4"/>
  <text class="small" x="444" y="204">somente opt-in</text>
</svg>
